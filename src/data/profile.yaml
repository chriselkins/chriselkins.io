    body: >-
      I lead engineering teams and run day-to-day DevOps: setting priorities,
      making architecture calls, reviewing code, and keeping production
      healthy. Teams that communicate well build better systems.
  - title: Software & SaaS
    body: >-
      I design and build SaaS platforms and custom software, from the data
      model and APIs to billing, deployment, and the internal tools teams use
