motto: Understand the problem, build the right thing, and make it dependable.

principles:
  - title: Operational simplicity
    body: >-
      Fewer moving parts, well-understood tools, and systems that are easy to
      observe, debug, and hand off. Simple systems are the ones that stay up.
  - title: Automate the repetitive work
    body: >-
      If a task gets done by hand more than twice, it becomes a script, a
      pipeline, or a scheduled job, so people can spend their time on
      judgment.
  - title: Security is part of the architecture
    body: >-
      Least privilege, safe defaults, and audit trails are designed in from
      the start, not bolted on before an audit.
  - title: Safe, incremental production changes
    body: >-
      Small, reversible changes, observable rollouts, and a rollback plan
      before every deploy.

