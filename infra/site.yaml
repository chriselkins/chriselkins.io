AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  chriselkins.io static site. Private S3 bucket served only through CloudFront
  (Origin Access Control), an ACM certificate validated in Route 53, and apex
  A/AAAA alias records. The distribution uses pay-as-you-go pricing (no
  flat-rate plan subscription). Deploy in us-east-1 (required for the
  CloudFront certificate).

Parameters:
  DomainName:
    Type: String
    Default: chriselkins.io
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Default: Z05989521VUDR072ZUETZ
  BucketName:
    Type: String
    Default: chriselkins-io-site

Rules:
  UsEast1Only:
    Assertions:
      - Assert: !Equals [!Ref 'AWS::Region', us-east-1]
        AssertDescription: CloudFront certificates must live in us-east-1.

Resources:
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
      KeyAlgorithm: EC_prime256v1
      CertificateTransparencyLoggingPreference: ENABLED
      Tags:
        - Key: Project
          Value: !Ref DomainName

  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      # Versioning makes a bad deploy recoverable; old versions expire after 30 days.
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: remove-expired-delete-markers
            Status: Enabled
            ExpiredObjectDeleteMarker: true
      Tags:
        - Key: Project
          Value: !Ref DomainName

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
          # Lets S3 answer 404 (not 403) for missing pages so the 404 page works.
          # CloudFront never forwards query strings here, so listings aren't reachable.
          - Sid: AllowCloudFrontList
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:ListBucket
            Resource: !GetAtt SiteBucket.Arn
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub '${SiteBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        Description: !Sub 'CloudFront access to ${BucketName}'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Astro builds /about/index.html. S3 has no directory indexes behind OAC, so
  # map /about/ to /about/index.html and redirect /about to /about/.
  DirectoryIndexFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-directory-index'
      AutoPublish: true
      FunctionConfig:
        Comment: Serve index.html for directory URLs; add the trailing slash
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.endsWith('/')) {
            request.uri = uri + 'index.html';
            return request;
          }
          var last = uri.slice(uri.lastIndexOf('/') + 1);
          if (last.indexOf('.') !== -1) return request;
          // No file extension: /about -> /about/ (serve directly if there is a query string).
          if (Object.keys(request.querystring).length > 0) {
            request.uri = uri + '/index.html';
            return request;
          }
          return {
            statusCode: 301,
            statusDescription: 'Moved Permanently',
            headers: { location: { value: uri + '/' } },
          };
        }

  # Search suggestions for the tools page's search boxes. Google and DuckDuckGo don't let other sites
  # read their suggestions, so the page gets them from /tools/suggest/ on this domain, which keeps the
  # CSP at connect-src 'self'. Only q passes through, onto a fixed path and query: Google answers a
  # callback= parameter with JSONP, and passing one along would let a script tag run code from this
  # domain, getting around script-src 'self'.
  SuggestFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-suggest'
      AutoPublish: true
      FunctionConfig:
        Comment: Send /tools/suggest/ requests to the search engine with a fixed query plus q
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        var UPSTREAM = {
          '/tools/suggest/google': { uri: '/complete/search', query: 'client=firefox' },
          '/tools/suggest/youtube': { uri: '/complete/search', query: 'client=firefox&ds=yt' },
          '/tools/suggest/duckduckgo': { uri: '/ac/', query: 'type=list' }
        };

        function handler(event) {
          var request = event.request;
          var upstream = UPSTREAM[request.uri];
          var q = request.querystring.q;
          // q must be percent-encoded (encodeURIComponent's characters), so it can't add a parameter.
          if (!upstream || !q || !/^[\w.!~*'()%-]+$/.test(q.value)) {
            return { statusCode: 400, statusDescription: 'Bad Request' };
          }
          request.uri = upstream.uri;
          request.querystring = upstream.query + '&q=' + q.value;
          return request;
        }

  # Sends the search engines only the query string SuggestFunction builds: no viewer headers or cookies.
  SuggestOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub '${AWS::StackName}-suggest'
        Comment: Search suggestion query strings only
        HeadersConfig:
          HeaderBehavior: none
        CookiesConfig:
          CookieBehavior: none
        QueryStringsConfig:
          QueryStringBehavior: whitelist
          QueryStrings: [client, ds, type, q]

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-security-headers'
        Comment: !Sub 'Security headers for ${DomainName}'
        SecurityHeadersConfig:
          # style-src needs 'unsafe-inline' for syntax-highlighting colors in code blocks; scripts stay 'self' only.
          # connect-src allows Akamai's time service, which /tools/ uses for an accurate clock.
          ContentSecurityPolicy:
            ContentSecurityPolicy: >-
              default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';
              img-src 'self'; font-src 'self'; connect-src 'self' https://time.akamai.com;
              form-action https://www.google.com https://duckduckgo.com;
              frame-ancestors 'none'; base-uri 'self'; object-src 'none';
              upgrade-insecure-requests
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          # Two years, every subdomain, and eligible for the browsers' preload list (hstspreload.org).
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: true
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
              Override: true
            - Header: Cross-Origin-Opener-Policy
              Value: same-origin
              Override: true
        RemoveHeadersConfig:
          Items:
            - Header: Server
            - Header: x-amz-server-side-encryption
            - Header: x-amz-version-id

  # /tools/ (my start page) and /downloads/ (its extension): the same headers, plus noindex, and no
  # referrer on anything the start page opens or fetches. CloudFormation doesn't allow YAML aliases,
  # so this repeats SecurityHeadersPolicy; infra/site.test.ts fails if the two drift apart.
  NoIndexHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-noindex-headers'
        Comment: !Sub 'Security headers plus noindex and no-referrer for ${DomainName}/tools/ and /downloads/'
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: >-
              default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';
              img-src 'self'; font-src 'self'; connect-src 'self' https://time.akamai.com;
              form-action https://www.google.com https://duckduckgo.com;
              frame-ancestors 'none'; base-uri 'self'; object-src 'none';
              upgrade-insecure-requests
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: no-referrer
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: true
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
              Override: true
            - Header: Cross-Origin-Opener-Policy
              Value: same-origin
              Override: true
            - Header: X-Robots-Tag
              Value: noindex, nofollow
              Override: true
        RemoveHeadersConfig:
          Items:
            - Header: Server
            - Header: x-amz-server-side-encryption
            - Header: x-amz-version-id

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${DomainName} static site'
        Aliases:
          - !Ref DomainName
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_All
        Origins:
          - Id: s3-site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          # Search suggestions for /tools/ (see SuggestFunction).
          - Id: google-suggest
            DomainName: suggestqueries.google.com
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
          - Id: duckduckgo-suggest
            DomainName: duckduckgo.com
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: s3-site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Managed-CachingOptimized: honors the Cache-Control set on each object at deploy time.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt DirectoryIndexFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          # Search suggestions for /tools/ (see SuggestFunction), never cached. CloudFront takes the first
          # pattern that matches, so these come before /tools/*.
          - PathPattern: /tools/suggest/google
            TargetOriginId: google-suggest
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: !Ref SuggestOriginRequestPolicy
            ResponseHeadersPolicyId: !Ref NoIndexHeadersPolicy
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt SuggestFunction.FunctionMetadata.FunctionARN
          - PathPattern: /tools/suggest/youtube
            TargetOriginId: google-suggest
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: !Ref SuggestOriginRequestPolicy
            ResponseHeadersPolicyId: !Ref NoIndexHeadersPolicy
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt SuggestFunction.FunctionMetadata.FunctionARN
          - PathPattern: /tools/suggest/duckduckgo
            TargetOriginId: duckduckgo-suggest
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: !Ref SuggestOriginRequestPolicy
            ResponseHeadersPolicyId: !Ref NoIndexHeadersPolicy
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt SuggestFunction.FunctionMetadata.FunctionARN
          # Same as the default, but with NoIndexHeadersPolicy. /tools (no slash) still takes the default
          # behavior, which only redirects it to /tools/.
          - PathPattern: /tools/*
            TargetOriginId: s3-site
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            ResponseHeadersPolicyId: !Ref NoIndexHeadersPolicy
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt DirectoryIndexFunction.FunctionMetadata.FunctionARN
          # The extension zips, never cached, so a change to the extension can be downloaded as soon as
          # it's deployed.
          - PathPattern: /downloads/*
            TargetOriginId: s3-site
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            ResponseHeadersPolicyId: !Ref NoIndexHeadersPolicy
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt DirectoryIndexFunction.FunctionMetadata.FunctionARN
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
      Tags:
        - Key: Project
          Value: !Ref DomainName

  ApexIPv4:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2 # CloudFront's fixed alias zone
        EvaluateTargetHealth: false

  ApexIPv6:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

Outputs:
  BucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
  CertificateArn:
    Value: !Ref Certificate
